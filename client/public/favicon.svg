<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tp-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18122B" />
      <stop offset="50%" stop-color="#393053" />
      <stop offset="100%" stop-color="#635985" />
    </linearGradient>
    <linearGradient id="tp-accent" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#92EEFF" />
      <stop offset="50%" stop-color="#30AFFF" />
      <stop offset="100%" stop-color="#D8FFC5" />
    </linearGradient>
    <filter id="tp-glow" x="12" y="8" width="40" height="48" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#30AFFF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#tp-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Building Icon Outline with Glow -->
  <g filter="url(#tp-glow)">
    <!-- Main Tower -->
    <path d="M22 18C22 15.79 23.79 14 26 14H38C40.21 14 42 15.79 42 18V50H22V18Z" fill="#18122B" stroke="url(#tp-accent)" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Left Wing -->
    <path d="M14 28C14 26.9 14.9 26 16 26H22V50H14V28Z" fill="#18122B" stroke="url(#tp-accent)" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Right Wing -->
    <path d="M42 32C42 30.9 42.9 30 44 30H50V50H42V32Z" fill="#18122B" stroke="url(#tp-accent)" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Center Tower Windows -->
    <rect x="27" y="20" width="3" height="3" rx="0.75" fill="#92EEFF" />
    <rect x="34" y="20" width="3" height="3" rx="0.75" fill="#92EEFF" />
    <rect x="27" y="26" width="3" height="3" rx="0.75" fill="#92EEFF" />
    <rect x="34" y="26" width="3" height="3" rx="0.75" fill="#D8FFC5" />
    <rect x="27" y="32" width="3" height="3" rx="0.75" fill="#D8FFC5" />
    <rect x="34" y="32" width="3" height="3" rx="0.75" fill="#92EEFF" />
    <rect x="27" y="38" width="3" height="3" rx="0.75" fill="#92EEFF" />
    <rect x="34" y="38" width="3" height="3" rx="0.75" fill="#D8FFC5" />

    <!-- Left Wing Windows -->
    <rect x="17" y="31" width="2.5" height="2.5" rx="0.5" fill="#92EEFF" opacity="0.85" />
    <rect x="17" y="37" width="2.5" height="2.5" rx="0.5" fill="#92EEFF" opacity="0.85" />
    
    <!-- Right Wing Windows -->
    <rect x="44.5" y="35" width="2.5" height="2.5" rx="0.5" fill="#D8FFC5" opacity="0.85" />
    <rect x="44.5" y="41" width="2.5" height="2.5" rx="0.5" fill="#92EEFF" opacity="0.85" />

    <!-- Main Portal Doorway -->
    <path d="M29 50V44C29 42.9 29.9 42 31 42H33C34.1 42 35 42.9 35 44V50H29Z" fill="url(#tp-accent)" />
  </g>
</svg>