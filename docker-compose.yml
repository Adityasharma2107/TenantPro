services:
  mongodb:
    image: mongo:7
    container_name: tenantpro-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tenantpro
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenantpro-network

  server:
    container_name: tenantpro-api
    build:
      context: .
      dockerfile: ./server/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/tenantpro
      CLIENT_URL: http://localhost:3000
      JWT_SECRET: production_jwt_secret_key_tenantpro_2026_change_in_production
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - tenantpro-network

  client:
    container_name: tenantpro-web
    build:
      context: .
      dockerfile: ./client/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - tenantpro-network

volumes:
  mongo_data:
    driver: local

networks:
  tenantpro-network:
    driver: bridge
